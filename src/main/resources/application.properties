spring.application.name=crm
server.port=8081
spring.config.import=optional:configserver:
spring.main.web-application-type=reactive
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/mydatabase}
spring.datasource.username=${DATABASE_USERNAME:myuser}
spring.datasource.password=${DATABASE_PASSWORD:secret}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.schema=crm
spring.datasource.hikari.connection-init-sql=CREATE SCHEMA IF NOT EXISTS crm
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=crm
# spring.graphql.path=/graphql
spring.graphql.http.path=/graphql
spring.graphql.schema.locations=classpath:graphql/**/
spring.graphql.graphiql.enabled=true

app.security.jwt.issuer=${JWT_ISSUER:crm-api}
app.security.jwt.secret=${JWT_SECRET:K8vN2pL9jR4mX7dF3wQ5hE6t1kY0sA8b}
app.security.jwt.access-token-ttl-minutes=${JWT_ACCESS_TOKEN_TTL_MINUTES:15}
app.security.jwt.refresh-token-ttl-days=${JWT_REFRESH_TOKEN_TTL_DAYS:30}
app.security.jwt.access-token-type=${JWT_ACCESS_TOKEN_TYPE:access}
app.security.jwt.refresh-token-type=${JWT_REFRESH_TOKEN_TYPE:refresh}
# Service-to-service keys (comma separated). Set via env: APP_SECURITY_SERVICE_KEYS=key1,key2
app.security.service-keys=${APP_SECURITY_SERVICE_KEYS:}